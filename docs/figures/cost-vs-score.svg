<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="748" viewBox="0 0 1000 748" role="img" aria-labelledby="t d">
<title id="t">Cost against score for every model and architecture</title>
<desc id="d">Scatter of mean cost per run (log scale) against mean score for 18 arms, with the uncertainty-aware Pareto frontier.</desc>
<style>
