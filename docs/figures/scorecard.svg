<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="776" viewBox="0 0 1000 776" role="img" aria-labelledby="t d">
<title id="t">Pre-registration scorecard, hypotheses H1 to H6</title>
<desc id="d">H1: Not supported. H2: Consistent. H3: Supported. H4: Not supported. H5: Partial. H6: Not supported.</desc>
<style>
  svg { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --bg: #fcfcfb; --ring: #e6e5df; --ink: #0b0b0b; --ink2: #52514e; --muted: #77756f;
    --grid: #ebeae4; --axis: #c3c2b7; --band: #f1f0ec; --eq: #e9f1fb;
    --a0: #5c5a54; --a1: #2b7fd9; --a2: #2f9a57; --a3: #b04a12; --a4: #5a3db0; --a5: #d4609f;
    --good: #0b7a0b; --good-bg: #e3f4e3; --warn: #8a5a00; --warn-bg: #fdf0d2;
    --bad: #b42323; --bad-bg: #fbe4e4; --info: #1c5cab; --info-bg: #e3eefb; }
  @media (prefers-color-scheme: dark) {
    svg { --bg: #1a1a19; --ring: #2f2f2c; --ink: #f0efec; --ink2: #c3c2b7; --muted: #9b9991;
      --grid: #2a2a28; --axis: #45453f; --band: #232321; --eq: #1b2633;
      --a0: #bcbab5; --a1: #5994e0; --a2: #18895b; --a3: #c05101; --a4: #7852bb; --a5: #c176a4;
      --good: #4fcf4f; --good-bg: #173117; --warn: #f2b73d; --warn-bg: #3a2d10;
      --bad: #f07a7a; --bad-bg: #3d1a1a; --info: #86b6ef; --info-bg: #17263a; }
  }
  .bg { fill: var(--bg); stroke: var(--ring); }
  .title { fill: var(--ink); font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { fill: var(--ink2); font-size: 15px; }
  .h { fill: var(--ink); font-size: 15px; font-weight: 650; }
  .t { fill: var(--ink); font-size: 14px; }
  .t2 { fill: var(--ink2); font-size: 13px; }
  .num { fill: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; }
  .num2 { fill: var(--ink2); font-size: 13px; font-variant-numeric: tabular-nums; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .cap { fill: var(--muted); font-size: 12px; }
  .b { font-weight: 650; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .zero { stroke: var(--ink2); stroke-width: 1.25; }
  .band { fill: var(--band); }
  .eq { fill: var(--eq); }
  .ink { fill: var(--ink); } .inks { stroke: var(--ink); fill: none; }
  .ink2s { stroke: var(--ink2); fill: none; }
  .muted { fill: var(--muted); }
  .hole { fill: var(--bg); }
  .f0 { fill: var(--a0); } .s0 { stroke: var(--a0); }
  .f1 { fill: var(--a1); } .s1 { stroke: var(--a1); }
  .f2 { fill: var(--a2); } .s2 { stroke: var(--a2); }
  .f3 { fill: var(--a3); } .s3 { stroke: var(--a3); }
  .f4 { fill: var(--a4); } .s4 { stroke: var(--a4); }
  .f5 { fill: var(--a5); } .s5 { stroke: var(--a5); }
  .good { fill: var(--good); } .good-bg { fill: var(--good-bg); }
  .warn { fill: var(--warn); } .warn-bg { fill: var(--warn-bg); }
  .bad { fill: var(--bad); } .bad-bg { fill: var(--bad-bg); }
  .info { fill: var(--info); } .info-bg { fill: var(--info-bg); }
</style>
<rect class="bg" x="0.5" y="0.5" width="999" height="775" rx="14"/>
<text x="32" y="52" class="title">Pre-registration scorecard</text>
<text x="32" y="80" class="sub">Six hypotheses, written and tagged (prereg-v1) before the first of the 900 runs.</text>
<text x="32" y="150" class="title">H1</text>
<text x="96" y="144" class="h">Scaffolds help the small model</text>
<text x="96" y="165" class="t2">On Haiku 4.5, plan-execute-verify or gated-execute scores better than single.</text>
<text x="96" y="187" class="num">Both inconclusive and below zero: plan-execute-verify −0.048 [−0.171, +0.051],</text>
<text x="96" y="205" class="num">gated-execute −0.094 [−0.215, +0.005].</text>
<rect x="818" y="130" width="150" height="30" rx="15" class="bad-bg"/>
<text x="893" y="150" class="bad b" text-anchor="middle" style="font-size:14px">✗  Not supported</text>
<line x1="32" y1="212" x2="968" y2="212" class="axis"/>
<text x="32" y="246" class="title">H2</text>
<text x="96" y="240" class="h">Scaffolds stop paying on the large model</text>
<text x="96" y="261" class="t2">On Opus 5.5, no architecture scores better than single.</text>
<text x="96" y="283" class="num">5 of 5 not better (all inconclusive). None shown equivalent, so a gain under 0.05</text>
<text x="96" y="301" class="num">is not established either.</text>
<rect x="818" y="226" width="150" height="30" rx="15" class="info-bg"/>
<text x="893" y="246" class="info b" text-anchor="middle" style="font-size:14px">≈  Consistent</text>
<line x1="32" y1="308" x2="968" y2="308" class="axis"/>
<text x="32" y="342" class="title">H3</text>
<text x="96" y="336" class="h">Every scaffold costs more</text>
<text x="96" y="357" class="t2">On every model, every multi-call architecture costs more than single.</text>
<text x="96" y="379" class="num">15 of 15 contrasts costlier, intervals above ×1: ×1.34 to ×4.77 per run.</text>
<rect x="818" y="322" width="150" height="30" rx="15" class="good-bg"/>
<text x="893" y="342" class="good b" text-anchor="middle" style="font-size:14px">✓  Supported</text>
<line x1="32" y1="404" x2="968" y2="404" class="axis"/>
<text x="32" y="438" class="title">H4</text>
<text x="96" y="432" class="h">Interaction: the gain shrinks with scale</text>
<text x="96" y="453" class="t2">plan-execute-verify gains more over single on Haiku 4.5 than on Opus 5.5.</text>
<text x="96" y="475" class="num">Difference in gains −0.056 [−0.181, +0.050]: inconclusive, and the wrong sign.</text>
<rect x="818" y="418" width="150" height="30" rx="15" class="bad-bg"/>
<text x="893" y="438" class="bad b" text-anchor="middle" style="font-size:14px">✗  Not supported</text>
<line x1="32" y1="500" x2="968" y2="500" class="axis"/>
<text x="32" y="534" class="title">H5</text>
<text x="96" y="528" class="h">Scale beats scaffold, one step up</text>
<text x="96" y="549" class="t2">single on Sonnet 5.5 scores better than every architecture on Haiku 4.5.</text>
<text x="96" y="571" class="num">3 of 6 shown worse (plan-execute-verify, orchestrator-workers, gated-execute); the other 3</text>
<text x="96" y="589" class="num">below Sonnet single on point estimates but inconclusive after Holm.</text>
<rect x="818" y="514" width="150" height="30" rx="15" class="warn-bg"/>
<text x="893" y="534" class="warn b" text-anchor="middle" style="font-size:14px">◐  Partial</text>
<line x1="32" y1="596" x2="968" y2="596" class="axis"/>
<text x="32" y="630" class="title">H6</text>
<text x="96" y="624" class="h">Fan-out buys time on breadth research</text>
<text x="96" y="645" class="t2">On gold-key research, orchestrator-workers ties single on score and is faster.</text>
<text x="96" y="667" class="num">3 tasks, descriptive only. Slower on 3 of 3 models (median 71s vs 69s, 44s vs 27s, 64s vs 34s),</text>
<text x="96" y="685" class="num">at ×1.86–×3.08 the mean cost on those tasks, and never ahead of single on score.</text>
<rect x="818" y="610" width="150" height="30" rx="15" class="bad-bg"/>
<text x="893" y="630" class="bad b" text-anchor="middle" style="font-size:14px">✗  Not supported</text>
<text x="32" y="720" class="cap">H1–H3 confirmatory (baseline family); H4, H5 secondary, each its own Holm family; H6 descriptive (fewer than the 5 tasks a verdict needs).</text>
<text x="32" y="737" class="cap">n = 900 runs, all passing integrity checks. Verdicts: task-clustered paired bootstrap (10,000 draws), Holm-adjusted within each pre-registered family.</text>
<text x="32" y="754" class="cap">Run set scaffold-or-scale-v1 @ fce5807 · ScaffoldBench.</text>
</svg>
