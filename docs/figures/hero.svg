<rect class="bg" x="0.5" y="0.5" width="999" height="639" rx="14"/>
<text x="32" y="52" class="title">Scaffold or Scale?</text>
<text x="32" y="80" class="sub">Moving the single agent from Haiku 4.5 to Sonnet 5.5 raised its score by +0.129.</text>
<text x="32" y="101" class="sub">No scaffold beat the single agent on any model: the largest gain was +0.040, and none was significant.</text>
