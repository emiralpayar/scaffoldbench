  .f5 { fill: var(--a5); } .s5 { stroke: var(--a5); }
  .good { fill: var(--good); } .good-bg { fill: var(--good-bg); }
  .warn { fill: var(--warn); } .warn-bg { fill: var(--warn-bg); }
  .bad { fill: var(--bad); } .bad-bg { fill: var(--bad-bg); }
