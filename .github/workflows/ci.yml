name: CI

# Pushes to main, pull requests and the merge queue. A branch with an open
# pull request is checked once, as the pull request; listing every push as
# well ran the same commit twice.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A superseded commit's checks are worthless; cancel them rather than queue them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # No ANTHROPIC_API_KEY is available here, and none is needed: the tests
  # drive the real harness against a scripted SDK, and nothing touches the
  # network. A check that started requiring a key would be a regression in
  # the test suite, not a reason to add one.
  check:
    name: Typecheck and tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # engines says >=22: test the oldest supported line and the newest LTS.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Covers packages/*, the CLI and its tests, scripts/ and vitest.config.ts.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

  cli:
    name: CLI smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Every command here is free: none of them makes a model call.
      - name: Version and help
        run: |
          npm run --silent arena -- --version
          npm run --silent arena -- help run > /dev/null

      - name: Catalogs
        run: |
          npm run --silent arena -- tasks
          npm run --silent arena -- strategies

      - name: Report the committed run sets
        # Whatever state a committed run set is in (the first predates the
        # integrity checks and renders with a health warning), it must render.
        run: |
          npm run --silent arena -- report
          npm run --silent arena -- report demo-synthetic > /dev/null

      - name: Plan a matrix without running it
        run: npm run --silent arena -- run --tasks airline --strategies single,plan-execute --dry-run

      # Starts four real SDK sessions against an address nothing listens on, so
      # no request can leave the runner whatever credential it holds: catches
      # an SDK or CLI upgrade that breaks tool registration, structured output
      # or per-call MCP servers. (`arena doctor` would also report that no
      # credential is configured here, which is true and, for this job, beside
      # the point.)
      - name: Wiring canary
        run: npm run --silent check:wiring -- --init-only

  web:
    name: Build site (${{ matrix.results }} results)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The site has to build both against committed run sets and against
        # nothing at all — the empty state is what a fresh clone sees, and it is
        # the state the project ships in until a real benchmark has been run.
        results: [committed, empty]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Clear results
        if: matrix.results == 'empty'
        run: |
          find results -mindepth 1 -maxdepth 1 ! -name README.md -exec rm -rf {} +

      - name: Build
        run: npm run build:web
