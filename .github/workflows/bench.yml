name: Benchmark

on:
  workflow_dispatch:
    inputs:
      strategies:
        description: 'Comma-separated strategy ids, or "all".'
        required: false
        default: all
      tasks:
        description: 'Comma-separated task ids, or "all".'
        required: false
        default: all
      repeats:
        description: 'Repeats per strategy x task cell.'
        required: false
        default: '3'
      model:
        description: 'Model under test. Sweep with claude-sonnet-5; publish with claude-opus-5.'
        required: false
        default: claude-sonnet-5
      total-budget:
        description: 'Hard ceiling in USD for the whole matrix. The runner skips remaining cells once it is reached.'
        required: false
        default: '25'
  schedule:
    # Mondays, 04:17 UTC. Off the hour so it is not queued behind everybody
    # else's midnight cron.
    - cron: '17 4 * * 1'

# One benchmark at a time, ever. Two concurrent runs would race on results/ and
# on latest.json, and the loser's commit would be silently dropped. Queued
# rather than cancelled: a run that has already spent money should finish and
# record what it bought.
concurrency:
  group: benchmark-results
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bench:
    name: Run matrix and publish report
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ARENA_STRATEGIES: ${{ inputs.strategies || 'all' }}
      ARENA_TASKS: ${{ inputs.tasks || 'all' }}
      ARENA_REPEATS: ${{ inputs.repeats || '3' }}
      ARENA_MODEL: ${{ inputs.model || 'claude-sonnet-5' }}
      ARENA_TOTAL_BUDGET: ${{ inputs['total-budget'] || '25' }}
    steps:
      - name: Require an API key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set. Add it as a repository secret before running the benchmark."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Warn if there is nothing to replay
        # Replay mode never reaches the network, so an unrecorded research task
        # sees every retrieval miss and scores accordingly. That is a property of
        # the fixtures, not of the architecture under test, and it is worth
        # saying out loud rather than discovering in the leaderboard.
        run: |
          if [ ! -d fixtures ] || [ -z "$(ls -A fixtures 2>/dev/null)" ]; then
            echo '::warning::No fixtures are committed. Research tasks will run offline with no recorded sources. Record them with `arena run --tasks research --record` and commit fixtures/.'
          fi

      - name: Run benchmark
        # --replay: research tasks read only from committed fixtures, so the web
        # half of the matrix costs nothing beyond the model calls and cannot
        # drift with the live web between runs. It is already the default; it is
        # spelled out here because a benchmark that quietly started hitting the
        # network would be a different measurement.
        run: |
          npm run --silent arena -- run \
            --strategies "$ARENA_STRATEGIES" \
            --tasks "$ARENA_TASKS" \
            --repeats "$ARENA_REPEATS" \
            --model "$ARENA_MODEL" \
            --total-budget "$ARENA_TOTAL_BUDGET" \
            --replay

      - name: Identify the run set
        # latest.json is the pointer the site renders; the newest run-set
        # directory is the fallback, and works because run set ids are ISO
        # timestamps and therefore sort chronologically.
        run: |
          run_set=$(node -e '
            const fs = require("node:fs");
            const pointer = "results/latest.json";
            if (fs.existsSync(pointer)) {
              const { runSetId } = JSON.parse(fs.readFileSync(pointer, "utf8"));
              if (runSetId && fs.existsSync(`results/${runSetId}/manifest.json`)) {
                process.stdout.write(runSetId);
                process.exit(0);
              }
            }
            const dirs = fs.readdirSync("results", { withFileTypes: true })
              .filter((e) => e.isDirectory() && fs.existsSync(`results/${e.name}/manifest.json`))
              .map((e) => e.name)
              .sort();
            process.stdout.write(dirs.at(-1) ?? "");
          ')
          if [ -z "$run_set" ]; then
            echo '::error::The benchmark produced no run set.'
            exit 1
          fi
          echo "ARENA_RUN_SET=$run_set" >> "$GITHUB_ENV"

      - name: Write report
        # --markdown writes results/<runSetId>/REPORT.md; stdout is the
        # fixed-width terminal rendering, which is kept in the job log.
        run: |
          set -o pipefail
          npm run --silent arena -- report --markdown | tee /tmp/arena-report.txt

      - name: Publish report to the job summary
        run: |
          {
            echo "## Benchmark — \`$ARENA_RUN_SET\`"
            echo
            echo "model: \`$ARENA_MODEL\` · repeats: \`$ARENA_REPEATS\` · budget: \`\$$ARENA_TOTAL_BUDGET\` · fixtures: \`replay\`"
            echo
            if [ -s "results/$ARENA_RUN_SET/REPORT.md" ]; then
              cat "results/$ARENA_RUN_SET/REPORT.md"
            elif [ -s /tmp/arena-report.txt ]; then
              # Fall back to the terminal rendering, fenced so its column
              # alignment survives markdown.
              echo '```'
              cat /tmp/arena-report.txt
              echo '```'
            else
              echo "_The report command produced no output._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add results
          if git diff --cached --quiet; then
            echo 'No new results to commit.'
            exit 0
          fi
          git commit -m "Benchmark run $ARENA_RUN_SET ($ARENA_MODEL, $ARENA_REPEATS repeats)"
          # The concurrency group makes us the only writer, so a rebase here can
          # only be picking up unrelated commits pushed while the matrix ran.
          git pull --rebase --autostash
          git push
